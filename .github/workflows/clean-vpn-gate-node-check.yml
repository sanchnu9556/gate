name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchnu9556/gate
      WF_ID_VPNCHECK: 377578548
      WF_ID_SELF: 379278140
      API_VER: -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version:2022-11-28"
    steps:
      - name: Dry run - Only print run id, NO DELETE
        run: |
          set -e
          AUTH="-H Authorization: Bearer $TOKEN"
          echo "===== VPN workflow ====="
          VPN_RAW=$(curl -s $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_VPNCHECK/runs?per_page=100")
          VPN_IDS=$(echo "$VPN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          echo "VPN run ids:"
          echo "$VPN_IDS"

          echo -e "\n===== Clean workflow ====="
          CLEAN_RAW=$(curl -s $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_SELF/runs?per_page=100")
          CLEAN_IDS=$(echo "$CLEAN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          echo "Clean run ids:"
          echo "$CLEAN_IDS"
          echo -e "\n⚠️ Dry-run模式，没有删除任何记录"
