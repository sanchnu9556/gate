name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchnu9556/gate
      WF_ID_VPNCHECK: 377578548
      WF_ID_SELF: 379278140
    steps:
      - name: Clean old workflow runs
        run: |
          set -e
          API_HEADER="-H X-GitHub-Api-Version:2022-11-28"

          # ========== VPN Gate Node Check：保留最新1条，其余删除 ==========
          echo "===== Process VPN workflow id: $WF_ID_VPNCHECK ====="
          VPN_RAW=$(gh api $API_HEADER --paginate "/repos/$REPO/actions/workflows/$WF_ID_VPNCHECK/runs")
          # 按创建时间降序，只筛选已完成的，输出id列表
          VPN_RUNS=$(echo "$VPN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          VPN_ARRAY=($VPN_RUNS)
          VPN_COUNT=${#VPN_ARRAY[@]}
          echo "VPN total completed runs: $VPN_COUNT"
          if (( VPN_COUNT > 1 )); then
            # 跳过索引0（最新一条），删除后面全部
            for ((i=1; i<VPN_COUNT; i++)); do
              rid=${VPN_ARRAY[$i]}
              echo "Delete VPN old run: $rid"
              gh api $API_HEADER --method DELETE "/repos/$REPO/actions/runs/$rid" || true
              sleep 0.3
            done
          else
            echo "VPN runs <=1, skip delete"
          fi

          # ========== Clean自身工作流：全部删除已完成run ==========
          echo -e "\n===== Process Clean workflow id: $WF_ID_SELF ====="
          CLEAN_RAW=$(gh api $API_HEADER --paginate "/repos/$REPO/actions/workflows/$WF_ID_SELF/runs")
          CLEAN_RUNS=$(echo "$CLEAN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          CLEAN_ARRAY=($CLEAN_RUNS)
          CLEAN_COUNT=${#CLEAN_ARRAY[@]}
          echo "Clean total completed runs: $CLEAN_COUNT"
          for rid in "${CLEAN_ARRAY[@]}"; do
            echo "Delete Clean history run: $rid"
            gh api $API_HEADER --method DELETE "/repos/$REPO/actions/runs/$rid" || true
            sleep 0.3
          done

          echo -e "\n✅ Clean task finished"
