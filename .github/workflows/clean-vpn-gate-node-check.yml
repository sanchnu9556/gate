name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchnu9556/gate
      WF_ID_VPNCHECK: 377578548
      WF_ID_SELF: 379278140
    steps:
      - name: Dry run debug (print raw api response)
        run: |
          set -e
          echo "===== VPN workflow API raw response ====="
          VPN_RAW=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version:2022-11-28" \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_VPNCHECK/runs?per_page=100")
          echo "$VPN_RAW"
