name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: sanchnu9556/gate
      WF_ID_VPNCHECK: 377578548
      WF_ID_SELF: 379278140
      API_VER: -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version:2022-11-28"
    steps:
      - name: Clean old workflow runs (curl version)
        run: |
          set -e
          AUTH="-H Authorization: Bearer $TOKEN"

          # ========== VPN 工作流：保留最新1条已完成run，其余删除 ==========
          echo "===== Process VPN workflow id: $WF_ID_VPNCHECK ====="
          VPN_RAW=$(curl -s $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_VPNCHECK/runs?per_page=100")
          # jq筛选已完成、按创建时间降序，提取run id
          VPN_IDS=$(echo "$VPN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          VPN_ARR=($VPN_IDS)
          VPN_LEN=${#VPN_ARR[@]}
          echo "VPN 已完成记录总数: $VPN_LEN"
          if (( VPN_LEN > 1 )); then
            # 跳过索引0（最新一条），循环删除剩下全部
            for ((i=1; i<VPN_LEN; i++)); do
              rid=${VPN_ARR[$i]}
              echo "删除VPN旧记录 run_id: $rid"
              curl -s -X DELETE $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/runs/$rid"
              sleep 0.3
            done
          else
            echo "VPN记录≤1，无需删除"
          fi

          # ========== Clean自身工作流：全部删除已完成run ==========
          echo -e "\n===== Process Clean workflow id: $WF_ID_SELF ====="
          CLEAN_RAW=$(curl -s $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID_SELF/runs?per_page=100")
          CLEAN_IDS=$(echo "$CLEAN_RAW" | jq -r '.workflow_runs | map(select(.conclusion != null)) | sort_by(-(.created_at | fromdateiso8601)) | .[].id')
          CLEAN_ARR=($CLEAN_IDS)
          CLEAN_LEN=${#CLEAN_ARR[@]}
          echo "Clean已完成记录总数: $CLEAN_LEN"
          for rid in "${CLEAN_ARR[@]}"; do
            echo "删除Clean历史记录 run_id: $rid"
            curl -s -X DELETE $AUTH $API_VER "https://api.github.com/repos/$REPO/actions/runs/$rid"
            sleep 0.3
          done

          echo -e "\n✅ 清理任务执行完毕"
